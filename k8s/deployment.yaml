apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrn-client-fe
  namespace: bookins-paas
  labels:
    app: idrn-client-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idrn-client-fe
  template:
    metadata:
      labels:
        app: idrn-client-fe
    spec:
      # No secrets are mounted: this is a static, public SPA.
      containers:
        - name: idrn-client-fe
          image: ghcr.io/rob-grokism/idrn-client-fe:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
